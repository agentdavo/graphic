<?xml version="1.0"?>
<!-- Match vkmin.h's _Noreturn declaration when analyzing a caller without
     vkmin.c in the same translation unit. This is a function contract, not
     a diagnostic suppression. VKMIN_FAIL overrides must also never return. -->
<def format="2">
  <function name="vkmin_fail">
    <noreturn>true</noreturn>
    <arg nr="1" direction="in">
      <not-null/>
      <strz/>
      <not-uninit/>
    </arg>
    <arg nr="2" direction="in"><not-uninit/></arg>
    <formatstr/>
    <arg nr="3" direction="in">
      <formatstr/>
      <strz/>
      <not-null/>
      <not-uninit/>
    </arg>
  </function>
</def>

# Build the CMake tree and render one frame under lavapipe on a GPU-less
# runner. This replaces the two make-based workflows, whose targets (the test
# suite, the goldens, the package consumers) are no longer in the tree.
#
# Warnings are errors and GCC's analyser runs in the normal build, so a clean
# build here is the check. It is not a substitute for the suite that was
# removed: nothing below compares a recorded frame against a replayed one.
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Ubuntu 24.04's mesa-vulkan-drivers is Mesa 24.0, and lavapipe of that
      # vintage is a 2024 driver being asked to run a Vulkan 1.4-era renderer.
      # The kisak PPA carries a current Mesa. This project's own history did
      # the same thing by hand: CLAUDE.md still describes a Mesa downloaded
      # into build/deps rather than the distro one.
      - name: Install Vulkan, a current lavapipe, glslang and a backend
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libvulkan-dev glslang-tools spirv-tools \
            mesa-vulkan-drivers vulkan-validationlayers libglfw3-dev vulkan-tools
          dpkg -l mesa-vulkan-drivers | tail -1
      # Ubuntu 24.04's libvulkan-dev is Vulkan 1.3.275 era, and this is a 1.4
      # codebase: unifiedImageLayouts, hostImageCopy and maintenance5 are not
      # declared by those headers, so vkmin.c cannot compile against them.
      # Only the headers need to be current -- every newer entry point is
      # resolved through vkGetDeviceProcAddr, so the stock loader still links.
      # Pinned to the same SDK version this is developed against.
      - name: Vulkan headers matching the SDK this targets
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DVulkan_INCLUDE_DIR="$RUNNER_TEMP/vulkan-headers/include"
      - name: Build
        run: cmake --build build
      - name: Validate every SPIR-V module
        run: cmake --build build --target validate-shaders
      # No VK_DRIVER_FILES here, deliberately. Setting it *replaces* the
      # loader's search path rather than adding to it, so naming one ICD file
      # that turns out not to exist leaves the loader with no drivers at all
      # and vkCreateInstance returns VK_ERROR_INCOMPATIBLE_DRIVER -- which is
      # exactly what happened, and what the annotation below finally showed.
      # On a GPU-less runner lavapipe is the only ICD installed, so letting
      # the loader find it is both simpler and correct. The pinned path in
      # CLAUDE.md is a Windows workaround and does not belong here.
      - name: What the loader can see
        run: |
          echo "::notice::ICDs: $(ls /usr/share/vulkan/icd.d/ 2>&1 | tr '\n' ' ')"
          vulkaninfo --summary 2>&1 | head -40 || true
      # A workflow log needs a token to read; a ::error:: annotation does not.
      # So on failure this re-emits what the program actually said as
      # annotations, which is the only way to see a runtime message from
      # outside without credentials. Three guesses at this failure were wrong
      # -- the analyser, the headers, the Mesa version -- and two of those
      # were only ruled out by evidence the job itself produced.
      - name: Smallest possible frame
        run: |
          set +e
          ./build/omega --headless --size 64 64 --frame 0 --out probe.png --verbose > probe.log 2>&1
          code=$?
          set -e
          cat probe.log
          if [ "$code" -ne 0 ]; then
            echo "::error::omega exited $code"
            tail -n 12 probe.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "$code"
          fi
      - name: Render a frame under lavapipe
        run: ./build/omega --headless --size 640 360 --frame 300 --out frame300.png
      # vkmin targets 1.4 with a 1.3 floor, and the two paths must produce the
      # same pixels. lavapipe is the natural place to check it: a software
      # rasteriser is exactly the "1.3 driver is supported, not degraded" case,
      # and it will normally select LEGACY on its own. Forcing both and
      # comparing is stronger than the record/replay check, which only proves a
      # journal replays -- this proves the floor renders.
      - name: The 1.3 floor and the 1.4 path render the same pixels
        run: |
          ./build/omega --headless --size 320 180 --frame 300 --out legacy.png --path=legacy
          ./build/omega --headless --size 320 180 --frame 300 --out modern.png --path=modern
          cmp legacy.png modern.png
          ./build/scene --headless --size 320 180 --frame 300 --out s-legacy.png --path=legacy
          ./build/scene --headless --size 320 180 --frame 300 --out s-modern.png --path=modern
          cmp s-legacy.png s-modern.png
      # The outside path -- analytic sky, the water composite, bloom -- had no
      # runtime coverage at all until scene grew an --outdoor mode, so sky.frag
      # and water.frag were in the same position render.c was before scene
      # existed: compiled, embedded, and never run.
      - name: The outdoor path agrees across paths too
        run: |
          ./build/scene --headless --size 320 180 --frame 300 --out out.png --record out.vkj --outdoor
          ./build/replay --replay out.vkj --frame 300 --path=legacy --out out-replay.png
          cmp out.png out-replay.png
          ./build/scene --headless --size 320 180 --frame 300 --out out-legacy.png --outdoor --path=legacy
          ./build/scene --headless --size 320 180 --frame 300 --out out-modern.png --outdoor --path=modern
          cmp out-legacy.png out-modern.png
      # The one agreement check the tree can still make: a frame rendered
      # directly, and the same frame replayed from its journal by a different
      # program on the other code path. Byte equality or nothing.
      - name: Record on the modern path, replay on the legacy one
        run: |
          ./build/omega --headless --size 320 180 --frame 300 --out direct.png --record f300.vkj
          ./build/replay --replay f300.vkj --frame 300 --path=legacy --out replayed.png
          cmp direct.png replayed.png
      # The same check over the render layer, which omega does not link. Without
      # this, render.c, cull.comp, cluster.comp and the lit shaders have no
      # runtime coverage at all and the check above stays green regardless of
      # what they do. d_check_cull compares the GPU draw list against the CPU
      # reference; the run must end with zero mismatches.
      - name: The render layer agrees across paths, and its GPU cull matches the CPU
        run: |
          ./build/scene --headless --size 320 180 --frame 300 --out scene.png --record scene.vkj
          ./build/replay --replay scene.vkj --frame 300 --path=legacy --out scene-replay.png
          cmp scene.png scene-replay.png
          ./build/scene --headless --size 320 180 --frames 298,299,300 \
            --out-dir cull --profile lavapipe +d_check_cull 1 2>&1 | tee cull.log
          grep -q '0 cull mismatches' cull.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame300
          path: frame300.png
          if-no-files-found: warn

  # Packager and viewer decoder: no GPU, no browser, but Node for the shared
  # JavaScript the viewer and the tests both use.
  inspector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tools -p test_inspector.py -v
      # The tree used to enforce line budgets from its test suite. That suite
      # went, and for a while the budgets were numbers in a README that nothing
      # checked. This is that gate again, on code lines rather than raw ones so
      # that documenting the code does not look like growth.
      - name: Code size against budget
        run: python tools/sizes.py --check

  # The other three backends are parallel implementations; they earn their keep
  # only if they keep compiling.
  backends:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [sdl2, glfw]
        include:
          - backend: sdl2
            packages: libsdl2-dev
          - backend: glfw
            packages: libglfw3-dev
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libvulkan-dev glslang-tools ${{ matrix.packages }}
      # Ubuntu 24.04's libvulkan-dev is Vulkan 1.3.275 era, and this is a 1.4
      # codebase: unifiedImageLayouts, hostImageCopy and maintenance5 are not
      # declared by those headers, so vkmin.c cannot compile against them.
      # Only the headers need to be current -- every newer entry point is
      # resolved through vkGetDeviceProcAddr, so the stock loader still links.
      # Pinned to the same SDK version this is developed against.
      - name: Vulkan headers matching the SDK this targets
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
      - run: cmake -S . -B build -G Ninja -DVKMIN_PLATFORM=${{ matrix.backend }} -DVulkan_INCLUDE_DIR="$RUNNER_TEMP/vulkan-headers/include"
      - run: cmake --build build

  # Built one target at a time. A step name is visible in the API without a
  # token while the log is not, so when this fails the step that failed says
  # which target broke -- which is the whole diagnosis from outside.
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libvulkan-dev glslang-tools
      - name: Report the compiler
        run: cc --version && cmake --version | head -1
      # Ubuntu 24.04's libvulkan-dev is Vulkan 1.3.275 era, and this is a 1.4
      # codebase: unifiedImageLayouts, hostImageCopy and maintenance5 are not
      # declared by those headers, so vkmin.c cannot compile against them.
      # Only the headers need to be current -- every newer entry point is
      # resolved through vkGetDeviceProcAddr, so the stock loader still links.
      # Pinned to the same SDK version this is developed against.
      - name: Vulkan headers matching the SDK this targets
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DVKMIN_HEADLESS=ON -DVulkan_INCLUDE_DIR="$RUNNER_TEMP/vulkan-headers/include"
      # No device, no instance, no driver: the suballocator is offset and size
      # arithmetic, so this is the one check that runs anywhere. It is also the
      # code where a mistake is invisible -- overlapping ranges corrupt two
      # live resources without asking Vulkan anything illegal.
      - name: The pure units, with no GPU
        run: |
          cmake --build build --target test_units
          ./build/test_units
      - name: Build shaders
        run: cmake --build build --target shaders
      - name: Build vkmin
        run: cmake --build build --target vkmin
      - name: Build sndmin
        run: cmake --build build --target sndmin
      - name: Build render
        run: cmake --build build --target render
      - name: Build replay
        run: cmake --build build --target replay
      - name: Build scene
        run: cmake --build build --target scene
      - name: Build omega
        run: cmake --build build --target omega

  # Same tree with GCC's analyser off. If this passes while the jobs above
  # fail, the difference is -fanalyzer on a compiler three major versions
  # older than the one this is developed against, not the code.
  headless-no-analyser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libvulkan-dev glslang-tools
      # Ubuntu 24.04's libvulkan-dev is Vulkan 1.3.275 era, and this is a 1.4
      # codebase: unifiedImageLayouts, hostImageCopy and maintenance5 are not
      # declared by those headers, so vkmin.c cannot compile against them.
      # Only the headers need to be current -- every newer entry point is
      # resolved through vkGetDeviceProcAddr, so the stock loader still links.
      # Pinned to the same SDK version this is developed against.
      - name: Vulkan headers matching the SDK this targets
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
      - name: Configure without the analyser
        run: cmake -S . -B build -G Ninja -DVKMIN_HEADLESS=ON -DVKMIN_ANALYZER=OFF -DVulkan_INCLUDE_DIR="$RUNNER_TEMP/vulkan-headers/include"
      - name: Build everything
        run: cmake --build build

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Every name here is checked against `pacman -Si`. Two earlier ones
          # were invented and do not exist -- there is no vulkan-devel (it is
          # headers plus loader) and sdl3 is lowercase -- and setup-msys2 fails
          # the whole job on an unknown package before any build runs.
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-sdl3
      - shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
